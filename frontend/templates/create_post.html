{% extends "base.html" %}

{% block title %}Create Post{% endblock %}

{% block extra_css %}
<style>
  body {
    background: url('https://images.unsplash.com/photo-1519681393784-d120267933ba?auto=format&fit=crop&w=1600&q=80') no-repeat center center/cover;
    background-attachment: fixed;
  }
  .create-post-card {
    backdrop-filter: blur(12px);
    background: rgba(255, 255, 255, 0.95);
    border-radius: 12px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.2);
  }
  .file-upload {
    border: 2px dashed #ccc;
    padding: 1.5rem;
    text-align: center;
    border-radius: 6px;
    background: #fafafa;
    color: #888;
    cursor: pointer;
    transition: border-color 0.3s ease;
  }
  .file-upload:hover {
    border-color: #0d6efd;
    color: #0d6efd;
  }
</style>
{% endblock %}

{% block content %}
<div class="container my-5">
  <div class="card p-4 create-post-card col-md-8 offset-md-2">
    <h2 class="text-center mb-4">Create a New Post</h2>

    <form method="POST" enctype="multipart/form-data">
      {% csrf_token %}

      <div class="mb-3">
        <label for="title" class="form-label">Post Title</label>
        <input type="text" class="form-control" id="title" name="post_title" placeholder="Enter post title" required>
      </div>

      <div class="mb-3">
        <label for="category" class="form-label">Your Category</label>
        <input type="text" class="form-control" id="category" name="category" placeholder="Enter story category" required>
      </div>

      <div class="mb-3">
        <label for="email" class="form-label">Your Email</label>
        <input type="email" class="form-control" id="email" name="email" placeholder="Enter your email" required>
      </div>

      <div class="mb-3">
        <label for="image" class="form-label">Upload Image</label>
        <input type="file" name="image" id="image" class="form-control">
      </div>

      <div class="mb-3">
        <label for="description" class="form-label">Post Content</label>
        <textarea class="form-control" id="description" name="description" placeholder="Write your post..." rows="4" required></textarea>
      </div>

      <button type="submit" class="btn btn-primary w-100">Publish Post</button>
    </form>
  </div>
</div>
{% endblock %}
