<!-- Like / Dislike Section -->
<div class="d-flex justify-content-between align-items-center mt-3">
  <!-- Like Form -->
  <form action="{% url 'tags_name' post.post_id 'likes' %}" method="post" class="d-inline">
    {% csrf_token %}
    <button type="submit" class="btn btn-outline-success btn-sm">
      👍 Like ({{ post.likes.likes }})
    </button>
  </form>
<div>      <a href="{% url 'delete_post' post.post_id %}" class="btn btn-outline-danger btn-sm mt-2">🗑 Delete</a>
</div>
  <!-- Dislike Form -->
  <form action="{% url 'tags_name' post.post_id 'dislikes' %}" method="post" class="d-inline">
    {% csrf_token %}
    <button type="submit" class="btn btn-outline-danger btn-sm">
      👎 Dislike ({{ post.likes.dislikes }})
    </button>
  </form>
</div>
