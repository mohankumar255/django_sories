<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <title>Social Media Base</title>
  <style>

  .post-label {
    width: 110px;
    font-weight: 600;
  }
  .post-card {
    min-height: 350px; /* optional: equal height cards */
  }
  .post-image {
    max-width: 280px;
    border-radius: 6px;
  }

  .img-medium {
    max-width: 300px;   /* medium width */
    max-height: 250px;  /* medium height */
    object-fit: cover;  /* crop if needed */
    margin: 3 auto;     /* center if smaller */
    display: block;
    border-radius: 6px;
  }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f0f2f5;
    }
    header {
      background: #4267B2;
      color: white;
      padding: 1rem;
      text-align: center;
      font-size: 1.5rem;
    }
    .container {
      display: flex;
      min-height: 100vh;
    }
    aside {
      width: 250px;
      background: #fff;
      padding: 1rem;
      border-right: 1px solid #ccc;
    }
    aside ul {
      list-style: none;
      padding: 0;
    }
    aside ul li {
      margin: 1rem 0;
    }
    aside ul li a {
      text-decoration: none;
      color: #333;
    }
    main {
      flex: 1;
      padding: 1rem;
    }
    .post {
      background: white;
      margin-bottom: 1rem;
      padding: 1rem;
      border-radius: 6px;
      box-shadow: 0 0 5px rgba(0,0,0,0.1);
    }
    .post h3 {
      margin: 0 0 0.5rem;
    }
    .post p {
      margin: 0.5rem 0;
    }
    @media (max-width: 768px) {
      .container {
        flex-direction: column;
      }
      aside {
        width: 100%;
        border-right: none;
        border-bottom: 1px solid #ccc;
      }
    }
  </style>
</head>
<body>
  <header>
    MySocialApp
  </header>
  <div class="container">
    <aside>
      <ul>
        <li><a href="/home">Home</a></li>
        <li><a href="/show_feed">Feed</a></li>
        <li><a href="/create_post">Create Post</a></li>
        <li><a href="#">Profile</a></li>
        <li><a href="#">Settings</a></li>
      </ul>
    </aside>
    <main>
      <div class="container">
        {% block content %}
        {% endblock %}
    </div>
    </main>
  </div>
</body>
</html>
